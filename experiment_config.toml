gyro_drift_axis = [1.0, -0.75, 0.5]
gyro_drift_levels_rad_s2 = [1.0e-6, 3.0e-6, 8.0e-6]
mag_misalignment_levels_deg = [5.0, 10.0, 20.0, 30.0]

# D — multi-sensor / combined faults
