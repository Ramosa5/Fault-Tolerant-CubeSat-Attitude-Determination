# MASTER EXPERIMENT CONFIGURATION
# Run every experiment with: python run_project.py

[run]
results_root = "results"
name = "cubesat_fdir"
stop_on_error = true


[visualization]
# Publication-style plots adapted from the figures4papers conventions.
enabled = true
formats = ["png", "pdf"]
dpi = 300
font_size = 15
axes_linewidth = 2.0


[animation]
# Interactive 3D orbit + attitude validation saved as self-contained HTML.
enabled = true
frame_stride = 20
# Animation-only cap. If frame_stride would create more frames, it is increased automatically.
max_frames = 600
# Optional visualization window; use "none" to render the entire simulated interval.
start_time_s = "none"
end_time_s = "none"
# Rendering-only downsampling for the dashed Earth ground track.
ground_track_max_points = 900
# "cdn" keeps each HTML small; use "directory" for offline HTML with one shared plotly.min.js.
include_plotlyjs = "cdn"
playback_frame_ms = 80
# Optional compact video overview. Requires ffmpeg on PATH.
save_mp4 = false
mp4_fps = 20
mp4_max_frames = 900
mp4_dpi = 110
vector_length_km = 900.0
# Visual-only 3D CubeSat dimensions. Mesh geometry scales with scene zoom.
satellite_visual_size_km = [140.0, 90.0, 90.0]
# Make the Sun vector prominent and always identifiable.
sun_vector_length_scale = 1.35
sun_arrowhead_size_km = 140.0
body_pointing_axis = "x"
show_true_axes = true
show_estimated_axes = true
show_sun_vector = true
show_mag_vector = true
show_velocity_vector = true
show_nadir_vector = true
show_full_orbit = true
# Earth geographic context for visual validation. Ground track uses ECI -> ECEF rotation.
show_earth_graticule = true
graticule_step_deg = 30.0
show_lat_lon_labels = true
show_ground_track = true
ground_track_opacity = 0.38
ground_track_width = 5
ground_track_dash = "dash"
ground_track_surface_offset_km = 10.0
# Default used by generic animations; operational scenarios override this with their illumination epoch.
earth_epoch_utc = "2026-01-01T00:00:00+00:00"

[animation.phase4]
enabled = true

[animation.phase5]
enabled = true
# Scenario IDs from fault_campaign.scenarios to animate.
scenario_ids = [0, 3, 8, 9]


[scenario]
# Select one end-to-end operational scenario. Future scenarios are added to the registry
# and chosen here without changing the command used to launch the project.
enabled = true
active = "reaction_wheel_fault_campaign"

[scenarios.sun_pointing]
duration_s = 600.0
dt_s = 0.1
pointing_axis = "x"
initial_error_deg = 30.0
omega0_rad_s = [0.0, 0.0, 0.0]
inertia_kg_m2 = [0.020, 0.025, 0.030]
# Constant ECI Sun vector for algorithm verification. Later this can be replaced by Orekit ephemeris.
sun_vector_eci = [1.0, 0.2, 0.1]
# Ideal-state PD controller for the first closed-loop validation scenario.
kp = 0.002
kd = 0.01
max_torque_nm = 0.002
settling_threshold_deg = 1.0
settling_duration_s = 10.0

[scenarios.sun_pointing.animation]
enabled = true

[scenarios.sun_pointing_comparison]
# Closed-loop three-branch comparison using MEKF feedback in every main branch:
# 1) healthy MEKF, 2) faulty Sun sensor + MEKF, 3) same fault + ML virtual Sun sensor + MEKF.
duration_s = 3000.0
dt_s = 0.1
pointing_axis = "x"
initial_error_deg = 30.0
omega0_rad_s = [0.0, 0.0, 0.0]
inertia_kg_m2 = [0.020, 0.025, 0.030]
# Used only when illumination.sun_model = "constant".
sun_vector_eci = [1.0, 0.2, 0.1]
mag_vector_eci = [0.25, -0.10, 0.96]
kp = 0.002
kd = 0.01
max_torque_nm = 0.002
settling_threshold_deg = 1.0
settling_duration_s = 10.0

# Current recovery model reconstructs the Sun sensor, so supported comparison faults are:
# sun_loss, sun_dropout, sun_noise
fault_type = "sun_loss"
fault_severity = "medium"
fault_start_s = 250.0
fault_end_s = 450.0
fault_seed = 4501
comparison_seed = 7301

# The MEKF uses a larger measurement covariance for ML-reconstructed Sun vectors
# so the filter does not treat a virtual measurement as equally precise as a real sensor.
ml_virtual_sensor_noise_std = 0.01
# Safety gate: ML candidate must agree with the gyro-propagated MEKF direction.
ml_gate_deg = 2.0
# Accepted candidates are blended conservatively with the MEKF propagated direction.
ml_blend = 0.25


[scenarios.sun_pointing_comparison.modes]
# Operational ADCS state machine:
# SUN_ACQUISITION -> SUN_POINTING -> ECLIPSE_DRIFT -> SUN_REACQUISITION -> SUN_POINTING
# In ECLIPSE_DRIFT the Sun-pointing torque is exactly zero; MEKF continues with gyro + magnetometer.
pointing_threshold_deg = 1.0
pointing_hold_s = 10.0

[scenarios.sun_pointing_comparison.illumination]
# "analytic" gives a calendar-dependent changing ECI Sun direction using a compact
# solar ephemeris. Use "constant" for the earlier algorithm-only sanity check.
sun_model = "analytic"
epoch_utc = "2026-01-01T00:00:00+00:00"
# Physical Earth shadow calculated from the configured orbit and apparent Earth/Sun disks.
eclipse_enabled = true
# In full umbra a real Sun sensor has no direct Sun measurement.
eclipse_sun_sensor_unavailable = true

[scenarios.sun_pointing_comparison.virtual_sensor]
# Physics-informed lightweight MLP virtual Sun sensor. Gyro propagation advances the
# previous Sun vector; the MLP learns a bounded correction from magnetometer + gyro data.
hidden = [48, 24]
train_runs = 24
train_duration_s = 40.0
epochs = 18
batch_size = 256
seed = 8128

[scenarios.sun_pointing_comparison.animation]
enabled = true


# PHYSICAL MAGNETORQUER-ONLY SUN-POINTING SCENARIO
# This is the current high-fidelity AOCS case. The older ideal-torque scenarios remain available.
[scenarios.magnetic_sun_pointing_comparison]
duration_s = 6000.0
dt_s = 0.1
pointing_axis = "x"
initial_error_deg = 30.0
omega0_rad_s = [0.0, 0.0, 0.0]

fault_type = "sun_loss"
fault_severity = "medium"
fault_start_s = 250.0
fault_end_s = 450.0
fault_seed = 4501
comparison_seed = 7301
ml_virtual_sensor_noise_std = 0.01
ml_gate_deg = 2.0
ml_blend = 0.25

[scenarios.magnetic_sun_pointing_comparison.spacecraft]
# 1U / 1 kg controller-development case. Replace with CAD-derived mission values later.
mass_kg = 1.0
# Body dimensions [X,Y,Z] in metres.
dimensions_m = [0.10, 0.10, 0.10]
# If inertia_kg_m2 is omitted, inertia is calculated from mass and dimensions as a uniform box.

[scenarios.magnetic_sun_pointing_comparison.magnetorquers]
# Three orthogonal rods. 0.4 A m^2 corresponds to a real CubeTorquer-class actuator rating.
max_dipole_am2 = [0.4, 0.4, 0.4]
# First-order electrical dipole response.
time_constant_s = 0.0065

[scenarios.magnetic_sun_pointing_comparison.controller]
# Select "projected_pd" (baseline) or "magnetic_ltv" (finite-horizon LTV magnetic regulator).
type = "magnetic_ltv"
# "sun_orbit" constrains +X to Sun and +Z near the orbit normal, eliminating free roll.
target_mode = "sun_orbit"
# Backward-compatible PD gains are still used for the desired-torque baseline and diagnostics.
kp = 8.0e-6
kd = 3.0e-4
desired_torque_limit_nm = 2.5e-5


[scenarios.magnetic_sun_pointing_comparison.controller.ltv]
# Finite-horizon LTV regulator. Future B directions enter the Riccati recursion.
horizon_s = 120.0
step_s = 5.0
update_interval_s = 2.0
regularization = 0.35
max_compensation = 2.0

[scenarios.magnetic_sun_pointing_comparison.controller.detumbling]
# Default robust detumbling/eclipsed rate damping uses gyro rate feedback, while
# still producing torque only through m x B. Set method = "bdot" to compare
# against classical B-dot in a dedicated experiment.
method = "rate_damping"
rate_damping_kd_nm_per_rad_s = 3.0e-3
rate_damping_torque_limit_nm = 1.0e-5
bdot_gain_am2_s_per_t = 2.0e5
bdot_deadband_t_per_s = 0.0
bdot_filter_tau_s = 2.0

[scenarios.magnetic_sun_pointing_comparison.controller.acquisition]
# Acquisition emphasizes alignment but includes substantially stronger rate damping
# than the original single-gain controller.
kp = 6.0e-6
kd = 8.0e-4
desired_torque_limit_nm = 2.5e-5

[scenarios.magnetic_sun_pointing_comparison.controller.reacquisition]
kp = 6.0e-6
kd = 8.0e-4
desired_torque_limit_nm = 2.5e-5

[scenarios.magnetic_sun_pointing_comparison.controller.pointing]
# Lower proportional gain and stronger damping reduce target fly-through/overshoot.
kp = 2.5e-6
kd = 1.2e-3
desired_torque_limit_nm = 1.5e-5

# Orbit used by the three-branch physical fault/recovery experiment.
# Options: "global", "iss_like", "high_beta_sunlit".
orbit_profile = "high_beta_sunlit"

[scenarios.magnetic_sun_pointing_comparison.high_beta_orbit]
altitude_m = 550000.0
inclination_deg = 97.6
phase_deg = 0.0
# "auto" selects RAAN from the Sun direction at illumination.epoch_utc to maximize |beta|.
raan_mode = "auto"

[scenarios.magnetic_sun_pointing_comparison.magnetic_field]
# Thesis runs: IGRF-14 via ppigrf. Use "dipole" only for fast code smoke tests.
model = "igrf14"

[scenarios.magnetic_sun_pointing_comparison.disturbances]
gravity_gradient = true

[scenarios.magnetic_sun_pointing_comparison.modes]
# SUN_POINTING is entered only if both the pointing error and body rate remain below
# their thresholds for the corresponding hold times.
pointing_threshold_deg = 2.0
pointing_hold_s = 20.0
rate_threshold_deg_s = 0.08
rate_hold_s = 10.0
# Above this rate, acquisition/reacquisition remains active but uses stronger internal damping.
rate_recovery_trigger_deg_s = 0.20
# Operational sequence:
# DETUMBLING -> SUN_ACQUISITION -> SUN_POINTING ->
# ECLIPSE_RATE_DAMPING -> SUN_REACQUISITION -> SUN_POINTING

[scenarios.magnetic_sun_pointing_comparison.illumination]
sun_model = "analytic"
epoch_utc = "2026-01-01T00:00:00+00:00"
eclipse_enabled = true
eclipse_sun_sensor_unavailable = true

[scenarios.magnetic_sun_pointing_comparison.virtual_sensor]
hidden = [48, 24]
train_runs = 24
train_duration_s = 40.0
epochs = 18
batch_size = 256
seed = 8128

[scenarios.magnetic_sun_pointing_comparison.animation]
enabled = true

# CONTROLLER × ORBIT ISOLATION EXPERIMENT
# Healthy MEKF only: same sensor noise, same 1U spacecraft, four controller/orbit combinations.
[scenarios.magnetic_control_orbit_matrix]
duration_s = 6000.0
dt_s = 0.1
pointing_axis = "x"
initial_error_deg = 30.0
omega0_rad_s = [0.0, 0.0, 0.0]
controllers = ["projected_pd", "magnetic_ltv"]
orbit_profiles = ["iss_like", "high_beta_sunlit"]
comparison_seed = 9107

[scenarios.magnetic_control_orbit_matrix.spacecraft]
mass_kg = 1.0
dimensions_m = [0.10, 0.10, 0.10]

[scenarios.magnetic_control_orbit_matrix.magnetorquers]
max_dipole_am2 = [0.4, 0.4, 0.4]
time_constant_s = 0.0065

[scenarios.magnetic_control_orbit_matrix.controller]
type = "projected_pd"
target_mode = "sun_orbit"
kp = 8.0e-6
kd = 3.0e-4
desired_torque_limit_nm = 2.5e-5

[scenarios.magnetic_control_orbit_matrix.controller.ltv]
horizon_s = 120.0
step_s = 5.0
update_interval_s = 2.0
regularization = 0.35
max_compensation = 2.0

[scenarios.magnetic_control_orbit_matrix.controller.detumbling]
method = "rate_damping"
rate_damping_kd_nm_per_rad_s = 3.0e-3
rate_damping_torque_limit_nm = 1.0e-5
bdot_gain_am2_s_per_t = 2.0e5
bdot_deadband_t_per_s = 0.0
bdot_filter_tau_s = 2.0

[scenarios.magnetic_control_orbit_matrix.controller.acquisition]
kp = 6.0e-6
kd = 8.0e-4
desired_torque_limit_nm = 2.5e-5
# Near-target capture/braking region used before SUN_POINTING handover.
capture_error_deg = 0.0
capture_kp = 2.0e-6
capture_kd = 4.0e-3
capture_torque_limit_nm = 1.2e-5

[scenarios.magnetic_control_orbit_matrix.controller.reacquisition]
kp = 6.0e-6
kd = 8.0e-4
desired_torque_limit_nm = 2.5e-5

[scenarios.magnetic_control_orbit_matrix.controller.pointing]
kp = 2.5e-6
kd = 1.2e-3
desired_torque_limit_nm = 1.5e-5

# Dedicated steady Sun-hold law. It uses rate-priority damping and a bounded
# leaky integral term to compensate persistent magnetic projection errors.
[scenarios.magnetic_control_orbit_matrix.controller.hold]
objective = "sun_primary"
kp = 5.0e-6
kd = 1.0e-2
ki = 1.0e-8
desired_torque_limit_nm = 1.8e-5
integral_limit_rad_s = 8.0
integral_leak_per_s = 0.02
rate_priority_deg_s = 0.05
rate_only_above_deg_s = 0.02
rate_damping_kd = 2.0e-2
# For +X Sun pointing, body-X error is roll about the Sun axis; de-emphasize it.
error_weights = [0.10, 1.0, 1.0]

[scenarios.magnetic_control_orbit_matrix.high_beta_orbit]
altitude_m = 550000.0
inclination_deg = 97.6
phase_deg = 0.0
raan_mode = "auto"

[scenarios.magnetic_control_orbit_matrix.magnetic_field]
model = "igrf14"

[scenarios.magnetic_control_orbit_matrix.disturbances]
gravity_gradient = true

[scenarios.magnetic_control_orbit_matrix.modes]
pointing_threshold_deg = 2.0
pointing_hold_s = 20.0
rate_threshold_deg_s = 0.08
rate_hold_s = 10.0
rate_recovery_trigger_deg_s = 0.20
pointing_exit_threshold_deg = 10.0

[scenarios.magnetic_control_orbit_matrix.illumination]
sun_model = "analytic"
epoch_utc = "2026-01-01T00:00:00+00:00"
eclipse_enabled = true

[scenarios.magnetic_control_orbit_matrix.animation]
# Generate lightweight interactive 3D animations for matrix cases.
enabled = true
# "all" generates all four combinations. To limit output, use for example:
# cases = ["high_beta_sunlit|magnetic_ltv"]
cases = ["all"]
eclipse_sun_sensor_unavailable = true

