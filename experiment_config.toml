# MULTI-SENSOR FAULT CAMPAIGN
# Reuses the complete reaction-wheel spacecraft/AOCS definition above.
# Each case is run as Healthy MEKF vs Faulty MEKF vs Faulty MEKF + ML recovery.
[scenarios.reaction_wheel_fault_campaign]
duration_s = 6000.0
dt_s = 0.1
orbit_profile = "global"
seed = 9201
animation_enabled = true
# Selected representative animations; use ["all"] to animate every case.
animation_cases = ["F0_baseline", "F3_sun_loss_large_gyro_bias", "F6_severe_estimator_corruption", "F8_sensor_blackout"]

[[scenarios.reaction_wheel_fault_campaign.cases]]
name = "F0_baseline"
start_s = 1000.0
end_s = 3000.0
sun = { type = "none" }
gyro = { type = "none" }
mag = { type = "none" }

[[scenarios.reaction_wheel_fault_campaign.cases]]
name = "F1_sun_loss_600s"
start_s = 1000.0
end_s = 1600.0
sun = { type = "sun_loss", severity = "high" }
gyro = { type = "none" }
mag = { type = "none" }

[[scenarios.reaction_wheel_fault_campaign.cases]]
name = "F2_sun_loss_2400s"
start_s = 1000.0
end_s = 3400.0
sun = { type = "sun_loss", severity = "high" }
gyro = { type = "none" }
mag = { type = "none" }

[[scenarios.reaction_wheel_fault_campaign.cases]]
name = "F3_sun_loss_large_gyro_bias"
start_s = 1000.0
end_s = 3400.0
sun = { type = "sun_loss", severity = "high" }
# ~1.1, -0.8 and 0.6 deg/s additional bias: intentionally severe FDIR stress case.
gyro = { type = "bias_step", bias_rad_s = [0.020, -0.014, 0.010] }
mag = { type = "none" }

[[scenarios.reaction_wheel_fault_campaign.cases]]
name = "F4_sun_loss_gyro_stuck"
start_s = 1000.0
end_s = 3400.0
sun = { type = "sun_loss", severity = "high" }
gyro = { type = "stuck", value_rad_s = [0.018, -0.012, 0.008] }
mag = { type = "none" }

[[scenarios.reaction_wheel_fault_campaign.cases]]
name = "F5_sun_loss_mag_misaligned"
start_s = 1000.0
end_s = 3400.0
sun = { type = "sun_loss", severity = "high" }
gyro = { type = "none" }
mag = { type = "misalignment", angles_deg = [18.0, -14.0, 22.0] }

[[scenarios.reaction_wheel_fault_campaign.cases]]
name = "F6_severe_estimator_corruption"
start_s = 1000.0
end_s = 3600.0
sun = { type = "sun_loss", severity = "high" }
gyro = { type = "bias_step", bias_rad_s = [0.020, -0.014, 0.010] }
mag = { type = "misalignment", angles_deg = [20.0, -16.0, 25.0] }

[[scenarios.reaction_wheel_fault_campaign.cases]]
name = "F7_stuck_gyro_stuck_mag"
