knowledge_inclination_uncertainty_deg = 0.50
knowledge_raan_uncertainty_deg = 0.25
knowledge_phase_uncertainty_deg = 1.0

# Main Group-D run can use a deterministic orbit-knowledge error. This changes
# only the ML context, never the physical spacecraft trajectory.
runtime_knowledge_altitude_error_m = 0.0
runtime_knowledge_inclination_error_deg = 0.25
runtime_knowledge_raan_error_deg = 0.0
runtime_knowledge_phase_error_deg = 0.0

[scenarios.reaction_wheel_fair_ml_campaign.models.dataset.masking]
