# ============================================================================
# FAIR 3 x 3 ML COMPARISON CAMPAIGN
# MLP / 1D CNN / GRU x sensor-only / orbital-context / physics-residual.
# All architectures within a variant use EXACTLY the same generated trajectories,
# complete-run train/validation/test split, windows, training fault realizations,
# sample indices and fitted normalization. Primary pointing metrics are evaluated
# only while the injected fault is active AND the Sun is physically visible.
# ============================================================================
[scenarios.reaction_wheel_fair_ml_campaign]
duration_s = 4000.0
dt_s = 0.1
seed = 99501
orbit_profile = "global"
magnetic_field_model = "igrf14"
plots_enabled = true

[scenarios.reaction_wheel_fair_ml_campaign.metrics]
# A Sun-pointing sample is primary only above this physical illumination fraction.
sunlight_min_illumination = 0.05
recovery_threshold_deg = 2.0
recovery_hold_s = 10.0

[scenarios.reaction_wheel_fair_ml_campaign.animation]
# Disabled for the large comparison campaign. Turn on later without code changes.
enabled = false
cases = []

[scenarios.reaction_wheel_fair_ml_campaign.models]
architectures = ["mlp", "cnn", "gru"]
variants = ["sensor_only", "orbital_context", "physics_residual"]
targets = ["gyro", "sun", "mag"]
window = 20
# Saving the common NPZ is optional; the manifest is always saved.
save_shared_dataset_npz = false

[scenarios.reaction_wheel_fair_ml_campaign.models.dataset]
# One dataset is generated ONCE and reused by all 27 trained networks.
runs = 30
duration_s = 50.0
dt_s = 0.1
window = 20
seed = 97001
split_seed = 97018
train_fraction = 0.70
validation_fraction = 0.15
# Test fraction is the remaining complete runs (~0.15).
altitude_m_range = [400000.0, 650000.0]
inclination_deg_range = [30.0, 98.0]
epoch_utc = "2026-01-01T00:00:00+00:00"
epoch_span_days = 365.0
training_magnetic_field_model = "dipole"
initial_attitude_error_max_deg = 35.0
body_rate_max_rad_s = 0.02
training_inertia_kg_m2 = [0.001667, 0.001667, 0.001667]
gyro_bias_training_std_rad_s = 3.0e-4


# Mission-specific orbit-context training.
# Sensor truth is generated on the actual orbit; orbital-context features are
# generated from a separately perturbed known/planned orbit.
[scenarios.reaction_wheel_fair_ml_campaign.models.dataset.mission_orbit]
enabled = true
nominal_altitude_m = 500000.0
nominal_inclination_deg = 51.6
nominal_raan_deg = 0.0
nominal_phase_deg = 0.0
