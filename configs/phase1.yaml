simulation:
  start_utc: "2026-01-01T00:00:00Z"
  duration_orbits: 2.0
  sample_time_s: 5.0
  integrator_rtol: 1.0e-10
  integrator_atol: 1.0e-12

orbit:
  altitude_km: 500.0
  eccentricity: 0.0
  inclination_deg: 97.4
  raan_deg: 90.0
  arg_perigee_deg: 0.0
  true_anomaly_deg: 0.0
  use_j2: true

environment:
  sun_model: "low_precision_eci"
  eclipse_model: "cylindrical_umbra"
  magnetic_model: "tilted_centered_dipole"
  magnetic_equatorial_surface_uT: 31.2
  magnetic_dipole_lat_deg: 80.65
  magnetic_dipole_lon_deg: -72.68

visualization:
  dpi: 160
  make_static_png: true
  make_interactive_html: true

output:
  csv: "data/generated/phase1_environment.csv"
  summary_json: "data/results/phase1_summary.json"
  results_dir: "data/results"
